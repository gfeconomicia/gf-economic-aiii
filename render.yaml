services:
  - type: web
    name: gf-economic-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /var/data/gf_economic_ai.db
    disk:
      name: gf-economic-ai-data
      mountPath: /var/data
      sizeGB: 1
